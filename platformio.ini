[env:tab5]
; M5Stack's documented ESP32-P4 platform, pinned at known Git tags.
; First physical build/flash is gated by backup and screen-revision checks.
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/M5Stack/M5Unified.git#0.2.23
    https://github.com/M5Stack/M5GFX.git#0.2.30
